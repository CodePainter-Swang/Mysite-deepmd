<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可视化展示 - DeepMD系统</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/visualization.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="{% static 'img/MD.png' %}" alt="MD Logo" class="nav-logo">
                <h1>AI for Science</h1>
            </div>
            <ul class="nav-links">
                <li><a href="{% url 'demo001:index' %}">首页</a></li>
                <li><a href="{% url 'demo001:upload_file' %}">数据上传</a></li>
                <li><a href="/analysis">分子模拟</a></li>
                <li class="dropdown">
                    <a href="/users">后管系统</a>
                    <ul class="dropdown-menu">
                        <li><a href="/profile">个人中心</a></li>
                        <li><a href="/users">用户列表</a></li>
                    </ul>
                </li>
            </ul>
            <div class="user-info">
                <span class="username">{{ request.session.username }}</span>
                <a href="{% url 'demo001:logout' %}" class="logout-btn">退出</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="visualization-options">
            <h2>可视化展示</h2>
            <p>选择要使用的可视化功能</p>
            
            <div class="visualization-cards">
                <!-- 原子轨迹可视化卡片 -->
                <a href="{% url 'demo001:visualization_trajectory' %}" class="visualization-card">
                    <div class="card-icon">
                        <i class="fas fa-atom"></i>
                    </div>
                    <div class="card-content">
                        <h3>原子轨迹可视化</h3>
                        <p>查看分子动力学模拟中原子的运动轨迹</p>
                    </div>
                </a>

                <!-- RDF曲线可视化卡片 -->
                <a href="{% url 'demo001:visualization_rdf' %}" class="visualization-card">
                    <div class="card-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="card-content">
                        <h3>RDF曲线可视化</h3>
                        <p>查看径向分布函数(RDF)分析结果</p>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 DeepMD系统 版权所有</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
